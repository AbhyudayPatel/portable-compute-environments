# Frontend nginx config for the browser environment.
#
# The static files are served straight out of the workspace volume (the
# developer's working copy, cloned by repo-init), so saving a file in the
# browser IDE and refreshing the page is the whole "deploy" loop.
server {
    listen 3000;
    server_name _;

    root /srv/workspace/core-app/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolve the backend at REQUEST time, not startup. nginx otherwise
        # caches the upstream IP forever and returns 502 after the backend
        # container is recreated with a new IP. 127.0.0.11 is Docker's
        # embedded DNS server.
        resolver 127.0.0.11 valid=5s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
