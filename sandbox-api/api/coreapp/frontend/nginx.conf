# Frontend nginx config.
#   - serves the static files in /usr/share/nginx/html
#   - reverse-proxies /api/* to the backend container over the compose network
#
# This means the browser only ever talks to ONE origin (localhost:3000);
# no CORS, no hard-coded backend port in the JavaScript.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolve the backend at REQUEST time, not startup. nginx otherwise
        # caches the upstream IP forever and returns 502 after the backend
        # container is recreated with a new IP. 127.0.0.11 is Docker's
        # embedded DNS server.
        resolver 127.0.0.11 valid=5s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
